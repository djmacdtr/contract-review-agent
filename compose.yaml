name: contract-review

x-app: &app
  image: contract-review-agent:dev
  build:
    context: .
    target: runtime
  env_file:
    - .env
  environment:
    ALLOW_HTTP_DOWNLOADS: ${ALLOW_HTTP_DOWNLOADS:-false}
    DOWNLOAD_HOST_ALLOWLIST: api,${DOWNLOAD_HOST_ALLOWLIST:-}
    UPLOAD_ROOT: ${UPLOAD_ROOT:-/var/lib/contract-review/uploads}
    CONSOLE_UPLOAD_BASE_URL: ${CONSOLE_UPLOAD_BASE_URL:-http://api:8000}
    CONSOLE_UPLOAD_RETENTION_DAYS: ${CONSOLE_UPLOAD_RETENTION_DAYS:-7}
    MAX_REFERENCE_FILES: ${MAX_REFERENCE_FILES:-20}
    PDF_MIN_TEXT_CHARS_PER_PAGE: ${PDF_MIN_TEXT_CHARS_PER_PAGE:-20}
    OCR_ENABLED: ${OCR_ENABLED:-false}
    DOCX_PAGE_LOCATION_ENABLED: ${DOCX_PAGE_LOCATION_ENABLED:-false}
    LLM_ENABLED: ${LLM_ENABLED:-false}
    LLM_FACT_REVIEW_ENABLED: ${LLM_FACT_REVIEW_ENABLED:-false}
    LLM_MAPPING_REVIEW_ENABLED: ${LLM_MAPPING_REVIEW_ENABLED:-false}
    LLM_SEMANTIC_PLAN_ENABLED: ${LLM_SEMANTIC_PLAN_ENABLED:-false}
    LLM_REQUIRE_INDEPENDENT_MODEL: ${LLM_REQUIRE_INDEPENDENT_MODEL:-true}
    LLM_RESPONSE_FORMAT: ${LLM_RESPONSE_FORMAT:-json_schema}
    LLM_NATIVE_STRUCTURED_OUTPUT: ${LLM_NATIVE_STRUCTURED_OUTPUT:-true}
    LLM_EXTRACTION_MAX_NUMERIC_CANDIDATES: ${LLM_EXTRACTION_MAX_NUMERIC_CANDIDATES:-48}
    OCR_BASE_URL: ${OCR_BASE_URL:-}
    OCR_AUTH_HEADER: ${OCR_AUTH_HEADER:-}
  depends_on:
    postgres:
      condition: service_healthy
  restart: unless-stopped

services:
  postgres:
    image: postgres:16.10-alpine
    ports:
      - "127.0.0.1:15432:5432"
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-contract_review}
      POSTGRES_USER: ${POSTGRES_USER:-contract}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-contract}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-contract} -d ${POSTGRES_DB:-contract_review}"]
      interval: 3s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  api:
    <<: *app
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000"]
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - upload_data:${UPLOAD_ROOT:-/var/lib/contract-review/uploads}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"]
      interval: 5s
      timeout: 4s
      retries: 20

  worker:
    <<: *app
    command: ["python", "-m", "app.worker"]
    depends_on:
      postgres:
        condition: service_healthy
      api:
        condition: service_healthy

  fixture-server:
    profiles: ["fixtures"]
    image: contract-review-agent:dev
    build:
      context: .
      target: runtime
    command: ["python", "-m", "http.server", "8080", "--bind", "0.0.0.0", "--directory", "/fixtures"]
    volumes:
      - type: bind
        source: ${LOCAL_FIXTURE_DIR:-./local-fixtures}
        target: /fixtures
        read_only: true
    restart: unless-stopped

  test:
    profiles: ["tools"]
    image: contract-review-agent:test
    build:
      context: .
      target: test
    env_file:
      - .env
    environment:
      APP_ENV: test
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-contract}:${POSTGRES_PASSWORD:-contract}@postgres:5432/contract_review_test
      TEST_ADMIN_DATABASE_URL: postgresql://${POSTGRES_USER:-contract}:${POSTGRES_PASSWORD:-contract}@postgres:5432/${POSTGRES_DB:-contract_review}
      MOCK_STAGE_DELAY_SECONDS: "0"
      LLM_ENABLED: "false"
      LLM_HTTP_RETRY_ATTEMPTS: "4"
      LLM_MAX_CONCURRENCY: "3"
      LLM_RESPONSE_FORMAT: prompt_only
      LLM_TEXT_RESPONSE_FORMAT: json_object
      LLM_ADVICE_RESPONSE_FORMAT: json_object
      LLM_NATIVE_STRUCTURED_OUTPUT: "false"
      LLM_EXTRACTION_TASK_CONCURRENCY: "3"
      OCR_ENABLED: "false"
      DOCX_PAGE_LOCATION_ENABLED: "false"
      ALLOW_HTTP_DOWNLOADS: "false"
      DOWNLOAD_HOST_ALLOWLIST: ""
    depends_on:
      postgres:
        condition: service_healthy
    command: ["python", "scripts/run_tests.py"]

volumes:
  postgres_data:
    name: contract-review-postgres-data
  upload_data:
    name: contract-review-upload-data
