services:
  api:
    ports: !reset []
    environment:
      ALLOW_HTTP_DOWNLOADS: "true"
      CONSOLE_UPLOAD_BASE_URL: http://api:8000
      OCR_BASE_URL: ${LOCAL_OCR_RELAY_BASE_URL:-http://host.docker.internal:18017}
      OCR_ENABLED: "true"
      DOCX_PAGE_LOCATION_ENABLED: "true"
      LLM_ENABLED: "true"

  worker:
    environment:
      ALLOW_HTTP_DOWNLOADS: "true"
      CONSOLE_UPLOAD_BASE_URL: http://api:8000
      OCR_BASE_URL: ${LOCAL_OCR_RELAY_BASE_URL:-http://host.docker.internal:18017}
      OCR_ENABLED: "true"
      DOCX_PAGE_LOCATION_ENABLED: "true"
      LLM_ENABLED: "true"

  nginx:
    image: nginx:1.28.3-alpine
    pull_policy: never
    ports:
      - "${LOCAL_WEB_BIND_ADDRESS:-127.0.0.1}:${LOCAL_WEB_PUBLISH_PORT:-80}:80"
    volumes:
      - ./deploy/local-server-parity/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1/health || exit 1"]
      interval: 5s
      timeout: 4s
      retries: 20
    restart: unless-stopped
