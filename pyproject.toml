[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[project]
name = "contract-review-agent"
version = "0.1.0"
description = "Milestone 0-1 scaffold for an asynchronous contract review agent"
requires-python = ">=3.12,<3.13"
dependencies = [
  "alembic==1.16.5",
  "asyncpg==0.30.0",
  "fastapi==0.116.1",
  "httpx==0.28.1",
  "langgraph==0.6.7",
  "orjson==3.11.3",
  "pdfplumber==0.11.7",
  "pydantic==2.11.7",
  "pydantic-settings==2.10.1",
  "python-multipart==0.0.20",
  "python-docx==1.2.0",
  "python-ulid==3.1.0",
  "rapidfuzz==3.14.1",
  "sqlalchemy[asyncio]==2.0.43",
  "structlog==25.4.0",
  "uvicorn[standard]==0.35.0",
]

[project.optional-dependencies]
test = [
  "pytest==8.4.2",
  "pytest-asyncio==1.1.0",
  "pytest-cov==6.2.1",
  "reportlab==4.4.3",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
